// Nutrient totals, cost and feasibility (below a minimum = not feasible).
const syncN=()=>{N.length=0;D.nut.forEach(n=>N.push([n.k,n.l,n.u]))};
function calc(F){const a=A(F.an),ing=D.ing.filter(i=>F.sel[i.id]),x=i=>+F.x[i.id]||0,t={};N.forEach(([k])=>t[k]=ing.reduce((s,i)=>s+x(i)/100*i[k],0));
const cost=ing.reduce((s,i)=>s+x(i)/100*i.pr,0),sum=ing.reduce((s,i)=>s+x(i),0),w=[];let ok=true;
if(!ing.length){w.push(['bad','Select at least one ingredient.']);ok=false}
if(ing.length&&Math.abs(sum-100)>.05){w.push(['bad',`Inclusion totals ${f2(sum)}%. It must be 100%.`]);ok=false}
ing.forEach(i=>{if(x(i)>i.max+1e-9){w.push(['warn',`${i.n} is above its ${i.max}% limit.`])}const need=x(i)/100*F.batch;if(need>i.stock+1e-9)w.push(['warn',`${i.n}: batch needs ${f2(need)} kg but stock is ${f2(i.stock)} kg.`])});
if(!a){w.push(['bad','Choose an animal and stage in Animals.']);ok=false}
else N.forEach(([k,l,u])=>{if(!a.r[k])return;const[lo,hi]=a.r[k];if(t[k]<lo-1e-9){w.push(['bad',`${l} is below the required ${u=='%'?'percentage':'level'}.`]);ok=false}else if(t[k]>hi+1e-9){w.push(['warn',`${l} is above the maximum of ${hi}.`])}});

/* packages/engine/src/formulation/leastCostEngine.js */
// The optimizer for least cost and nutritional targeting. HiGHS replaces it later.
function solve(n){const F=D.F,a=A(F.an),ing=D.ing.filter(i=>F.sel[i.id]);if(!a||!ing.length)return;
const T=(x,k)=>ing.reduce((s,i,j)=>s+x[j]/100*i[k],0),vi=x=>N.reduce((s,[k])=>{if(!a.r[k])return s;const v=T(x,k),[lo,hi]=a.r[k];return s+Math.max(0,lo-v)/(lo||1)+Math.max(0,v-hi)/(hi||1)},0),dv=x=>N.reduce((s,[k])=>{if(!a.r[k])return s;const m=(a.r[k][0]+a.r[k][1])/2;return s+Math.abs(T(x,k)-m)/(m||1)},0),lm=x=>N.reduce((s,[k])=>{if(!a.r[k])return s;const m=(a.r[k][0]+a.r[k][1])/2;return s+Math.max(0,m-T(x,k))/(m||1)},0),ob=x=>(F.method=='cost'?T(x,'pr')+20*lm(x):dv(x))+100*vi(x);
let x=ing.map(i=>Math.min(+F.x[i.id]||0,i.max)),s0=x.reduce((p,q)=>p+q,0);if(s0>100)x=x.map(v=>v*100/s0);let d0=100-x.reduce((p,q)=>p+q,0);x=x.map((v,j)=>{const q=Math.max(0,Math.min(d0,ing[j].max-v));d0-=q;return v+q});let o=ob(x);
for(let t=0;t<n;t++){const i=Math.random()*x.length|0,j=Math.random()*x.length|0;if(i==j)continue;const d=Math.random()*(t<n/2?2:.3);if(x[j]<d||x[i]+d>ing[i].max)continue;const y=[...x];y[i]+=d;y[j]-=d;const v=ob(y);if(v<o){o=v;x=y}}
D.ing.forEach(i=>{if(!F.sel[i.id])F.x[i.id]=0});ing.forEach((i,j)=>F.x[i.id]=Math.round(x[j]*100)/100)}

// Feed intake in kg or g, days feed lasts, FCR.
function intakeOn(g,d){const r=D.perf.filter(p=>p.gid==g.id&&p.fd&&p.d<=d).sort((a,b)=>a.d<b.d?1:-1)[0];return r?r.fd:(g.fd||0)}
function fcrData(g){const W=(D.wt||[]).filter(w=>w.gid==g.id).sort((a,b)=>a.d<b.d?-1:1);if(W.length<2)return[];const o=[];for(let i=1;i<W.length;i++){let feed=0;for(let t=new Date(W[0].d+'T00:00');t<new Date(W[i].d+'T00:00');t=new Date(t.getTime()+864e5))feed+=intakeOn(g,iso(t));const gain=(W[i].w-W[0].w)*g.n;if(gain>0&&feed>0)o.push([`Wk ${Math.round((new Date(W[i].d)-new Date(g.d))/6048e5)}`,feed/gain])}return o}
const intakeKg=(v,u,n)=>u=='flock'?v:u=='kg'?v*n:v*n/1000;

// Excel/CSV import-export helper for animals and inventory.
// Uses a minimal CSV parser (no dependencies) and generates downloadable CSV files.
// For .xlsx files, uses SheetJS if available, otherwise falls back to CSV.

function parseCSV(text){const rows=[],len=text.length;let i=0,row=[],field='';let inQuotes=false;while(i<len){const c=text[i];if(inQuotes){if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2}else{inQuotes=false;i++}}else{field+=c;i++}}else{if(c==='"'){inQuotes=true;i++}else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++}else if(c==='\r'){i++}else if(c===','){row.push(field);field='';i++}else{field+=c;i++}}if(field||row.length){row.push(field);rows.push(row)}return rows.filter(r=>r.length&&r.some(c=>c.trim()))}

function toCSV(rows){return rows.map(r=>r.map(c=>{c=String(c??'');return c.includes(',')||c.includes('"')||c.includes('\n')?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n')}

function downloadFile(name,content,type='text/csv'){const b=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b),a.download=name,a.click(),setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

// === Animals Excel ===
function exportAnimals(){const rows=[['Species','Stage','Duration From','Duration Unit','Duration To','Duration Unit']];N.forEach(n=>rows[0].push(n[1]+' Min ('+n[2]+')',n[1]+' Max ('+n[2]+')'));D.an.forEach(a=>{const r=[a.sp,a.st,a.dur?.f||'',a.dur?.fu||'week',a.dur?.t||'',a.dur?.tu||'week'];N.forEach(([k])=>{const v=a.r[k]||['',''];r.push(v[0],v[1])});rows.push(r)});downloadFile('agroversa-animals.csv',toCSV(rows))}

function importAnimalsModal(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{const rows=parseCSV(e.target.result);if(rows.length<2)return alert('File must have a header row and at least one data row.');const header=rows[0],data=rows.slice(1),preview=[],errors=[];data.forEach((r,i)=>{if(!r[0]||!r[1]){errors.push('Row '+(i+2)+': missing species or stage name.');return}const dur={f:+r[2]||0,fu:r[3]||'week',t:+r[4]||0,tu:r[5]||'week'};const reqs={};for(let j=6;j<header.length;j+=2){const label=header[j].replace(/ Min.*$/,''),lo=r[j],hi=r[j+1];if(lo===''&&hi==='')continue;const n=D.nut.find(n=>n.l.toLowerCase()===label.toLowerCase());if(!n){errors.push('Row '+(i+2)+': unknown nutrient "'+label+'".');continue}if(lo===''||hi===''||+lo>+hi){errors.push('Row '+(i+2)+': invalid range for '+label+'.');continue}reqs[n.k]=[+lo,+hi]}preview.push({sp:r[0],st:r[1],dur,reqs,row:i+2})});if(!preview.length)return alert('No valid rows to import.\n\n'+errors.join('\n'));

function confirmImportAnimals(preview){preview.forEach(p=>{const id=uid();D.an.push({id,sp:p.sp,st:p.st,dur:p.dur,r:p.reqs});if(!D.an.some(a=>a.id===D.F.an))D.F.an=id});save();closeM();render()}

// Schema version — migrates local data when the app updates.
const SCHEMA_VERSION = 2;

function migrateData(d) {
  if (!d) return d;
  const v = d._sv || 1;
  if (v < 2) {
    // v2: add record IDs and timestamps to all collections for sync
    const now = Date.now();
    const ensure = (arr) => arr.forEach(r => {
      if (!r.rid) r.rid = 'rec-' + now + '-' + Math.random().toString(36).slice(2, 8);
      if (!r._ts) r._ts = now;
      if (!r._del) r._del = 0;
    });
    if (d.ing) ensure(d.ing);
    if (d.an) ensure(d.an);
    if (d.runs) ensure(d.runs);
    if (d.batches) ensure(d.batches);
    if (d.perf) ensure(d.perf);
    if (d.gr) ensure(d.gr);
    if (d.wt) ensure(d.wt);
    if (d.mt) ensure(d.mt);
    if (d.ev) ensure(d.ev || (d.ev = []));
    if (d.mv) ensure(d.mv || (d.mv = []));
    d._sv = SCHEMA_VERSION;
  }
  return d;
}

/* packages/sync/src/sync.js */
// Sync engine — change tracking, sync queue, retry, conflict detection,
// soft deletion, sync status, sync history. Talks to the central server.

let SYNC_STATUS = 'offline'; // offline | idle | syncing | synced | failed
let SYNC_QUEUE = [];
let SYNC_HISTORY = [];
let SYNC_RUNNING = false;
let SYNC_RETRY_MS = 10000;
let SYNC_TIMER = null;

const syncServerUrl = () => ls.get('av_sync_url') || '';
const setSyncServerUrl = (u) => ls.set('av_sync_url', u);

function syncInit() {
  // Load queue and history from storage
  try { SYNC_QUEUE = JSON.parse(ls.get('av_sync_queue') || '[]'); } catch { SYNC_QUEUE = []; }
  try { SYNC_HISTORY = JSON.parse(ls.get('av_sync_hist') || '[]'); } catch { SYNC_HISTORY = []; }
  if (!syncServerUrl()) { SYNC_STATUS = 'offline'; return; }
  SYNC_STATUS = navigator.onLine ? 'idle' : 'offline';
  syncRun();
  // Retry on reconnect
  addEventListener('online', () => { SYNC_STATUS = 'idle'; SYNC_RETRY_MS = 10000; syncRun(); });
  addEventListener('offline', () => { SYNC_STATUS = 'offline'; });
  // Retry on tab focus
  addEventListener('visibilitychange', () => { if (!document.hidden && SYNC_STATUS === 'failed') syncRun(); });
  // Periodic retry
  setInterval(() => { if (SYNC_STATUS === 'failed' && syncServerUrl()) syncRun(); }, 30000);
}

// Track a change — called automatically on every save()
function syncTrack(collection, rid, action, data) {
  if (!rid) return;
  const item = {
    id: 'ch-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
    collection, rid, action: action || 'update',
    data: data ? JSON.parse(JSON.stringify(data)) : null,
    ts: Date.now(),
    retries: 0
  };
  SYNC_QUEUE.push(item);
  ls.set('av_sync_queue', JSON.stringify(SYNC_QUEUE));
  if (SYNC_STATUS === 'idle' || SYNC_STATUS === 'synced') syncRun();
}

async function syncRun() {
  if (SYNC_RUNNING) return;
  const url = syncServerUrl();
  if (!url || !navigator.onLine) { SYNC_STATUS = navigator.onLine ? 'idle' : 'offline'; return; }
  if (!SYNC_QUEUE.length && SYNC_STATUS === 'synced') return;
  SYNC_RUNNING = true;
  SYNC_STATUS = 'syncing';
  try {
    // Push pending changes
    const pending = SYNC_QUEUE.slice();
    if (pending.length) {
      const res = await fetch(url + '/sync/push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: U, deviceId: deviceId(),
          deviceName: deviceName(),
          schema: SCHEMA_VERSION,
          changes: pending
        })
      });
      if (!res.ok) throw new Error('Push failed: ' + res.status);
      const result = await res.json();
      // Handle conflicts — server returns resolved versions
      if (result.conflicts && result.conflicts.length) {
        result.conflicts.forEach(c => {
          // Last-write-wins: keep server version (newer), store other for reference
          const coll = D[c.collection];
          if (coll) {
            const local = coll.find(r => r.rid === c.rid);
            if (local && c.other) {
              local._conflict = c.other; // Keep for "Use the other" button
            }
          }
        });
      }
      // Remove successfully synced items
      const syncedIds = new Set(result.ok || pending.map(p => p.id));
      SYNC_QUEUE = SYNC_QUEUE.filter(q => !syncedIds.has(q.id));
      ls.set('av_sync_queue', JSON.stringify(SYNC_QUEUE));
    }
    // Pull changes from server
    const pullRes = await fetch(url + '/sync/pull?username=' + q(U) + '&deviceId=' + q(deviceId()) + '&since=' + (ls.get('av_sync_since') || 0));
    if (!pullRes.ok) throw new Error('Pull failed: ' + pullRes.status);
    const pullData = await pullRes.json();
    if (pullData.changes && pullData.changes.length) {
      syncApplyChanges(pullData.changes);
      ls.set('av_sync_since', pullData.latestTs || Date.now());
      save();
    }
    // Update device info on server
    await fetch(url + '/device/heartbeat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: U, deviceId: deviceId(), deviceName: deviceName() })
    });
    SYNC_STATUS = 'synced';
    SYNC_RETRY_MS = 10000;
    syncLog('synced', pending.length + ' pushed, ' + (pullData.changes ? pullData.changes.length : 0) + ' pulled');
  } catch (e) {
    SYNC_STATUS = 'failed';
    // Exponential backoff: 10s, 20s, 40s, 80s... max 5min
    SYNC_RETRY_MS = Math.min(SYNC_RETRY_MS * 2, 300000);
    syncLog('failed', e.message);
    if (SYNC_TIMER) clearTimeout(SYNC_TIMER);
    SYNC_TIMER = setTimeout(() => syncRun(), SYNC_RETRY_MS);
  } finally {
    SYNC_RUNNING = false;
  }
}

function syncApplyChanges(changes) {
  changes.forEach(ch => {
    if (!D[ch.collection]) return;
    const arr = D[ch.collection];
    const idx = arr.findIndex(r => r.rid === ch.rid);
    if (ch.action === 'delete') {
      // Soft delete — mark as deleted or remove if already soft-deleted locally
      if (idx >= 0) arr[idx]._del = 1, arr[idx]._ts = ch.ts;
    } else {
      if (idx >= 0) {
        // Update — last-write-wins
        if (ch.ts >= (arr[idx]._ts || 0)) {
          Object.assign(arr[idx], ch.data, { _ts: ch.ts, _del: 0 });
        }
      } else {
        // Insert
        arr.push({ ...ch.data, rid: ch.rid, _ts: ch.ts, _del: 0 });
      }
    }
  });
}

function syncLog(status, detail) {
  SYNC_HISTORY.unshift({ status, detail, ts: new Date().toISOString() });
  if (SYNC_HISTORY.length > 50) SYNC_HISTORY.pop();
  ls.set('av_sync_hist', JSON.stringify(SYNC_HISTORY));
}

// Sync status chip for the top bar
function syncChip() {
  if (!syncServerUrl()) return '';
  const pending = SYNC_QUEUE.length;
  const map = {
    offline: ['offline', 'mut'],
    idle: ['idle', 'mut'],
    syncing: ['syncing…', 'warn'],
    synced: [pending ? pending + ' pending' : 'synced', 'ok'],
    failed: ['retry', 'bad']
  };
  const [label, cls] = map[SYNC_STATUS] || ['—', 'mut'];
  return `<span class="chip ${cls}" style="font-size:11px;padding:2px 8px" onclick="syncRun()" title="${E(detail||'')}" role="button" tabindex="0">${E(label)}</span>`;
}

// Get linked devices from server
async function linkedDevices() {
  const url = syncServerUrl();
  if (!url) return [];
  try {
    const res = await fetch(url + '/devices?username=' + q(U));
    if (!res.ok) return [];
    return await res.json();
  } catch { return []; }
}

async function logOutDevice(devId) {

    await fetch(url + '/device/logout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },

    });
  } catch {}

// Register account on server for cross-device login
async function syncRegisterAccount(username, hash, salt, fn, pic) {
  const url = syncServerUrl();
  if (!url) return { ok: false, error: 'No sync server configured.' };
  try {
    const res = await fetch(url + '/account/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, hash, salt, fn, pic })
    });
    const data = await res.json();
    return data;
  } catch (e) { return { ok: false, error: 'Cannot reach the sync server.' }; }
}

// Sign in on a new device using server credentials
async function syncSignIn(username, password) {
  const url = syncServerUrl();
  if (!url) return { ok: false, error: 'No sync server configured.' };
  try {
    const res = await fetch(url + '/account/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, deviceId: deviceId(), deviceName: deviceName() })
    });
    const data = await res.json();
    if (data.ok && data.data) {
      // Load data from server into this device
      D = migrateData(data.data);
      D._sv = SCHEMA_VERSION;
      save();
      ls.set('av_sync_since', data.latestTs || Date.now());
    }
    return data;
  } catch (e) { return { ok: false, error: 'Cannot reach the sync server.' }; }
}

// Sync password change to server
async function syncPasswordChange(username, hash, salt) {
  const url = syncServerUrl();
  if (!url) return;
  try {
    await fetch(url + '/account/password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, hash, salt })
    });
  } catch {}
}

// Send a test notification via server
async function syncTestNotification() {
  const url = syncServerUrl();
  if (!url) return { ok: false, error: 'No sync server.' };
  try {
    const res = await fetch(url + '/notify/test', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: U, deviceId: deviceId() })
    });
    return await res.json();
  } catch { return { ok: false, error: 'Cannot reach server.' }; }
}

// Resolve a conflict by choosing the other version
function resolveConflict(collection, rid) {
  const arr = D[collection];
  if (!arr) return;
  const r = arr.find(x => x.rid === rid);
  if (r && r._conflict) {
    Object.assign(r, r._conflict, { _conflict: null });
    save();
    render();
  }
}

// Trigger sync now (manual button)
async function syncNow() {
  if (SYNC_RUNNING) {
    // Wait for the running sync to finish
    let tries = 0;
    while (SYNC_RUNNING && tries < 30) { await new Promise(r => setTimeout(r, 200)); tries++; }
    return;
  }
  SYNC_RETRY_MS = 10000;
  await syncRun();
}
